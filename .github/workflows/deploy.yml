name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One Pages deployment at a time, and a newer push to main supersedes an older, still-
# running one. With cancel-in-progress: false, two commits landing close together both
# reach actions/deploy-pages, but GitHub Pages allows only one in-progress deployment per
# environment — so the loser fails with a 400 ("Deployment request failed … due to in
# progress deployment. Please cancel <sha> first or wait"), leaving a spurious red ❌ even
# though the newer deploy wins. We only ever want the latest commit live, so cancelling the
# superseded run is the correct behavior (the edge-function deploy is idempotent, so the
# newer run redeploys it).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Did this push touch the edge function? That decides whether the Pages deploy has
  # anything to be atomic *about* (see the `deploy` gate below). Failing safe means
  # answering "yes": a redundant function deploy is idempotent, a missed one is not.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need both ends of the push range to diff them

      - name: Detect supabase/functions changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase/functions; then changed=false; fi
          fi
          echo "functions=$changed" >> "$GITHUB_OUTPUT"
          echo "supabase/functions changed in this push: $changed"

  deploy:
    # Gate the frontend flip on the edge-function deploy so a cutover that needs both is
    # atomic: if the function deploy *fails*, Pages is skipped and the site stays on the
    # previous build rather than serving React against the old function.
    #
    # But only a *failure* blocks. When the push didn't touch supabase/functions the job is
    # skipped, and there is nothing to be atomic about — the function already running in
    # production is the one this frontend was built against. Treating that skip as a block
    # is what let three consecutive runner outages ("The job was not acquired by Runner of
    # type hosted") hold back a frontend-only deploy that had no edge-function work in it.
    #
    # `changes` must have succeeded too: if the detection itself failed we don't know
    # whether the function changed, the function job would have skipped, and shipping the
    # frontend anyway is exactly the mismatch this gate exists to prevent.
    needs: [changes, deploy-edge-function]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.deploy-edge-function.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Single source of truth (web/.nvmrc) — keeps CI, Vercel, and local dev on the
          # same Node. Pinned to 22.x (Active LTS); Node 20 is EOL as of 2026-04.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        run: |
          npm ci --prefix web
          npm --prefix web run build

      - name: Stage dist
        run: |
          mkdir -p dist
          cp -r web/dist/* dist/
          # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a deep-link
          # refresh (e.g. /kccp/kiosk) loads the app and the router takes over.
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # A rerun keeps artifacts from earlier attempts under the same workflow run.
          # Name this attempt explicitly so deploy-pages always resolves exactly one.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub's Pages API occasionally returns a transient 5xx while the build and
      # uploaded artifact are healthy. Retry that external-service failure once instead
      # of requiring a new commit or a manual workflow rerun.
      - name: Wait before retrying GitHub Pages
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30

      - name: Retry GitHub Pages deployment
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment-retry
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-edge-function:
    # Only when the push actually changed the function. Deploying an unchanged function on
    # every frontend commit bought nothing and put a flaky third job in front of Pages.
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v2
        with:
          # Pinned: "latest" resolves the release via an unauthenticated GitHub API call,
          # which intermittently fails on shared runners with "rate limit exceeded" and
          # blocks the whole deploy (Pages `needs` this job). A pinned version downloads
          # directly. Bump deliberately (npm view supabase version).
          version: 2.109.0

      - name: Deploy Edge Function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy attendance-api --project-ref loovulhchmmwagtvjnhc --no-verify-jwt

      - name: Skip (no token configured)
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "SUPABASE_ACCESS_TOKEN secret not set — skipping Edge Function deploy. Add it in Settings → Secrets to enable auto-deploy."

  # Post a CI-success signal as a comment so a watching session is notified (the GitHub
  # integration forwards comments, but not raw CI-success events). Comments on the merged
  # PR associated with the commit, falling back to a commit comment for direct pushes.
  notify:
    needs: [deploy-edge-function, deploy]
    # `success()` would be false whenever the function job is legitimately skipped, so a
    # frontend-only deploy would go live without ever announcing itself. Ask the real
    # question instead: Pages went out, and the function did not fail.
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy-edge-function.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Comment deploy success
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.sha
            // Say which pieces actually shipped — "edge function + Pages are live" on a
            // run that never touched the function would be a claim nobody verified.
            const fn = ${{ toJSON(needs.deploy-edge-function.result) }}
            const what = fn === 'success' ? 'edge function + GitHub Pages are live' : 'GitHub Pages is live (edge function unchanged)'
            const body = `✅ Production deploy succeeded for \`${sha.slice(0, 7)}\` — ${what}.`
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })
            if (prs.length > 0) {
              for (const pr of prs) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
              }
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body })
            }
